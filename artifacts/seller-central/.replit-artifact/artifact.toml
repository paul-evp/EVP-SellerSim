kind = "web"
previewPath = "/"
title = "Amazon Seller Central Simulator"
version = "1.0.0"
id = "artifacts/seller-central"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 21239

[services.development]
run = "pnpm --filter @workspace/seller-central run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/seller-central", "run", "build" ]
serve = "static"
publicDir = "artifacts/seller-central/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "21239"
BASE_PATH = "/"
